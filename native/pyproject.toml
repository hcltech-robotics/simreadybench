[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "simreadybench-eval"
version = "1.0.2"
description = "Independent offline SimReadyBench evaluator and native Harbor task tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4", "Pillow==13.0.0", "usd-core==26.8"]

[project.optional-dependencies]
fetch = ["huggingface-hub==1.33.0", "hf-xet==1.7.0"]
validator = [
  "simready-foundation-tier-core==2026.8.0",
  "simready-validate==2026.8.0",
  "usd-validation-nvidia==1.22.0",
  "usd-profiles-nvidia==1.22.0",
  "physx-usd-schemas==25.11.2.72696984",
  "MaterialX==1.39.5",
]

[project.scripts]
simready-eval = "simready_eval.cli:main"
simready-feedback = "simready_eval.feedback:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["simready_eval", "simready_eval.*"]

[tool.setuptools.package-data]
simready_eval = ["profiles/*.json"]
