name: Execution and recovery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install execution and publication dependencies
        run: python -m pip install ".[test,daytona,publish]" build
      - name: Discover and test the local regression tier
        run: >-
          python -m pytest -q -p no:cacheprovider
      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist
