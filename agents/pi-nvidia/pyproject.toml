[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "simready-pi-nvidia"
version = "0.2.2"
description = "Plain Harbor Pi with explicit NVIDIA Build capabilities and formal feedback instructions"
requires-python = ">=3.12,<3.13"
dependencies = ["harbor==0.24.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "agent-client-protocol==0.12.1"]

[tool.setuptools.packages.find]
include = ["pi_nvidia*"]

[tool.setuptools.package-data]
pi_nvidia = ["*.txt", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
